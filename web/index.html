<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Himbaza Imana App">
  <meta name="theme-color" content="#6750A4">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Himbaza Imana">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/himbaza-imana-180.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="himbaza-imana.png"/>

  <title>Himbaza Imana</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { min-height: 100dvh; background: #6750A4; }
  </style>
</head>
<body>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", async () => {
        try {
          const registration = await navigator.serviceWorker.register(
            "pwa_service_worker.js",
            {
              scope: "./"
            }
          );

          console.log(
            "PWA service worker registered:",
            registration.scope
          );
        } catch (error) {
          console.error(
            "PWA service worker registration failed:",
            error
          );
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
